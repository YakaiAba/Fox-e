<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Chỉnh ảnh">
<meta name="theme-color" content="#FBF9F4">
<title>Chỉnh ảnh</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
:root{--ink:#5B6B8C;--ink2:#3E4A66;--bg:#ffffff;--paper:#FBF9F4;--mint:#A8D5C8;--mintd:#8CC0B0;--sun:#F3D9A4;--brick:#B23A2A;--ok:#4F8F7B;--bad:#B23A2A;--line:#D9DEE8;--tx:#3E4A66;--mut:#8590A8;--stage:#EFEDE7;
--wob:15px 11px 16px 10px/11px 16px 10px 15px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;height:100%;position:fixed;inset:0;width:100%;overflow:hidden;background:var(--paper);color:var(--tx);font:15px/1.35 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
.ic{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--paper)}
#top{background:#fff;color:var(--ink2);display:flex;align-items:center;gap:2px;padding:calc(env(safe-area-inset-top) + 4px) 8px 4px;min-height:48px;flex:0 0 auto;border-bottom:1.8px solid var(--ink)}
#top .ttl{font:700 20px/1 "Bradley Hand","Marker Felt","Segoe Print",cursive;margin:0 6px 0 4px;white-space:nowrap;color:var(--ink2)}
#top .sp{flex:1}
.ib{width:38px;height:38px;border-radius:var(--wob);color:var(--ink);display:flex;align-items:center;justify-content:center}
.ib:active,.ib.hold{background:var(--mint)}
.ib[disabled]{opacity:.3}
.sv{background:var(--sun);color:var(--ink2);font-weight:700;border:1.8px solid var(--ink);border-radius:var(--wob);padding:6px 14px;margin-left:4px}
.sv:active{background:var(--mint)}
#stageBox{flex:1;min-height:150px;position:relative;background:var(--stage);overflow:hidden;touch-action:none}
#tabs.shut .tab.on i{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
#zoom{position:absolute;transform-origin:0 0;will-change:transform}
#zoom canvas{display:block;position:absolute;left:0;top:0;width:100%;height:100%}
#ov{pointer-events:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--ink);text-align:center;padding:24px}
#empty svg.logo{width:104px;height:104px;filter:url(#wob)}
#empty .big{background:var(--mint);color:var(--ink2);font-weight:700;font-size:17px;padding:13px 26px;border:1.8px solid var(--ink);border-radius:var(--wob)}
#empty small{color:var(--mut);max-width:290px}
#bFit{position:absolute;right:10px;bottom:10px;background:#fff;border:1.5px solid var(--ink);color:var(--ink2);border-radius:var(--wob);padding:6px 12px;font-size:13px}
#panel{background:#fff;border-top:1.8px solid var(--ink);max-height:38vh;overflow-y:auto;padding:8px 12px 8px;flex:0 0 auto;-webkit-overflow-scrolling:touch;-webkit-user-select:none}
#tabs{display:flex;overflow-x:auto;background:var(--paper);border-top:1.5px solid var(--line);padding-bottom:calc(env(safe-area-inset-bottom)*.35);flex:0 0 auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:60px;padding:5px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut)}
.tab i{font-style:normal;width:40px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:var(--wob)}
.tab .ic{width:24px;height:24px}
.tab.on{color:var(--ink2);font-weight:700}
.tab.on i{background:var(--mint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:3px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:5px 11px;border-radius:var(--wob);background:#fff;border:1.5px solid var(--line);font-size:13px;white-space:nowrap;color:var(--ink2)}
.chip.on{background:var(--mint);border-color:var(--ink);font-weight:600}
.chip b{font-weight:600;opacity:.75;margin-left:2px}
.chip.dot::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sun);border:1.2px solid var(--ink);margin-left:5px;vertical-align:middle}
.sl{margin:2px 0 6px}
.sh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.sh span{flex:1}
.sh b{color:var(--ink2);min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.rs{font-size:15px;color:var(--ink);width:26px;height:22px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--ink);border-radius:2px;opacity:.55}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--sun);border:1.8px solid var(--ink);margin-top:-11.5px}
input[type=range]::-moz-range-track{height:3px;background:var(--ink);border-radius:2px;opacity:.55}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--sun);border:1.8px solid var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 6px;align-items:center}
.bt{padding:8px 14px;border-radius:var(--wob);background:#fff;border:1.6px solid var(--ink);font-size:14px;font-weight:600;color:var(--ink2)}
.bt:active{background:var(--mint)}
.bt.pri{background:var(--mint)}
.bt.red{background:#fff;color:var(--brick);border-color:var(--brick)}
.bt.sm{padding:5px 10px;font-size:13px}
.bt.grow{flex:1}
.bt[disabled]{opacity:.4}
.hint{font-size:12.5px;color:var(--mut);margin:2px 0 6px}
h4{margin:8px 0 4px;font-size:13px;color:var(--ink);letter-spacing:.2px}
.th{flex:0 0 auto;width:76px;text-align:center;font-size:11px;line-height:1.2;color:var(--tx)}
.th img,.th .ph{width:72px;height:72px;border-radius:var(--wob);object-fit:cover;display:block;margin:0 auto 3px;border:2.5px solid transparent;background:#e9ebf0}
.th.on img,.th.on .ph{border-color:var(--ink)}
.th span{display:block;height:26px;overflow:hidden}
.sw{display:flex;gap:7px;flex-wrap:wrap;margin:2px 0 6px}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--ink)}
.sw button.on{box-shadow:0 0 0 3px var(--ink)}
.sw input[type=color]{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none}
.mrow{display:flex;align-items:center;gap:10px;justify-content:center;margin:2px 0 8px}
.mph{width:96px;text-align:center;font-size:12px;color:var(--mut)}
.mph img,.mph .pl{width:96px;height:96px;border-radius:var(--wob);object-fit:cover;display:flex;align-items:center;justify-content:center;background:var(--paper);font-size:30px;color:var(--ink);margin-bottom:3px;border:2px dashed var(--ink)}
.mph img{border:2px solid var(--ink)}
.arr{font-size:24px;color:var(--ink)}
textarea.tx{width:100%;min-height:58px;border:1.5px solid var(--ink);border-radius:var(--wob);padding:8px;resize:vertical;-webkit-user-select:text;user-select:text}
select.sel,input.txt{width:100%;border:1.5px solid var(--ink);border-radius:var(--wob);padding:8px;background:#fff;-webkit-user-select:text;user-select:text}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:210px}
.g3 button{height:38px;border-radius:var(--wob);background:#fff;border:1.5px solid var(--line);font-size:12px}
.g3 button.on{background:var(--mint);border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}
.chk input{width:20px;height:20px;accent-color:var(--mintd)}
.brush{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--brick);opacity:.75;vertical-align:-1px;margin-right:4px}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(10px);background:var(--ink2);color:#fff;padding:9px 16px;border-radius:var(--wob);font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.mask{position:fixed;inset:0;background:#3E4A6688;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlg{background:#fff;border:1.8px solid var(--ink);border-radius:18px 14px 19px 13px/14px 19px 13px 18px;padding:16px;width:min(92vw,360px);max-height:86vh;overflow-y:auto;-webkit-user-select:none}
.dlg h3{margin:0 0 6px;font:700 19px "Bradley Hand","Marker Felt","Segoe Print",cursive;color:var(--ink2)}
.dlg p{margin:0 0 12px;color:var(--tx)}
.dbtn{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.dbtn .bt{flex:1}
#busy{position:fixed;inset:0;background:#3E4A66bb;z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#busy[hidden]{display:none}
#busy .sp{width:42px;height:42px;border:4px solid #ffffff55;border-top-color:var(--sun);border-radius:50%;animation:spin 1s linear infinite}
#busy .pb{width:200px;height:6px;background:#ffffff44;border-radius:3px;overflow:hidden}
#busy .pb div{height:100%;width:0;background:var(--sun)}
@keyframes spin{to{transform:rotate(360deg)}}
.sec{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div id="app">
  <header id="top">
    <button class="ib" id="bOpen" aria-label="Mở ảnh khác"></button>
    <div class="ttl">Chỉnh ảnh</div>
    <span class="sp"></span>
    <button class="ib" id="bUndo" aria-label="Hoàn tác" disabled></button>
    <button class="ib" id="bRedo" aria-label="Làm lại" disabled></button>
    <button class="ib" id="bCmp" aria-label="Giữ để xem ảnh gốc"></button>
    <button class="ib" id="bSet" aria-label="Cài đặt"></button>
    <button class="sv" id="bSave">Lưu</button>
  </header>
  <div id="stageBox">
    <div id="zoom"><canvas id="view"></canvas><canvas id="ov"></canvas></div>
    <div id="empty"><svg class="logo" viewBox="0 0 100 100" fill="none" stroke="#5B6B8C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="68" cy="30" r="12" fill="#F3D9A4"/><path d="M10 80 38 40l16 22 10-12 26 30z" fill="#A8D5C8"/><path d="M38 40l-9 13 9-3 7 8" stroke="#8CC0B0"/></svg><button class="big" id="bPick">Chọn ảnh</button><small>Ảnh được xử lý ngay trong máy, không gửi đi đâu. Giữ nút nửa tròn trên cùng để xem ảnh gốc.</small></div>
    <button id="bFit" hidden>⤢ Vừa khung</button>
  </div>
  <section id="panel"></section>
  <nav id="tabs"></nav>
</div>
<input type="file" id="fileMain" accept="image/*" hidden>
<input type="file" id="fileRef" accept="image/*" hidden>
<input type="file" id="fileLogo" accept="image/*" hidden>
<input type="file" id="fileSets" accept="application/json,.json" hidden>
<div id="toast"></div>
<div id="busy" hidden><div class="sp"></div><div id="busyMsg">Đang xử lý…</div><div class="pb"><div id="busyBar"></div></div></div>
<script>
'use strict';
var APP_VER='1.2 (31/10/2026)';
function $(s,r){return (r||document).querySelector(s)}
function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}
function clamp(v,a,b){return v<a?a:(v>b?b:v)}
function cv(w,h){var c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nextFrame(){return new Promise(function(r){requestAnimationFrame(function(){setTimeout(r,0)})})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}

/* Lưu trong máy: mọi khóa có tiền tố chinhanh. (các app cùng github.io dùng chung kho) */
var K_LOCAL='chinhanh.local',K_SETS='chinhanh.sets',K_COLORS='chinhanh.colors';
function lsGet(k,d){try{var s=localStorage.getItem(k);return s?JSON.parse(s):d}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast('Không lưu được: bộ nhớ máy đầy');return false}}
var LOCAL=Object.assign({maxEdge:3000,fmt:'jpg',q:0.92,wm:null},lsGet(K_LOCAL,{}));
function saveLocal(){lsSet(K_LOCAL,LOCAL)}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

var toastT;
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}

/* Hộp thoại tự làm: mọi nút có data-r sẽ đóng hộp và trả về giá trị */
function dialog(html,onMount){
  return new Promise(function(res){
    var m=document.createElement('div');m.className='mask';
    m.innerHTML='<div class="dlg">'+html+'</div>';
    document.body.appendChild(m);
    if(onMount)onMount(m);
    m.addEventListener('click',function(e){
      var b=e.target.closest('[data-r]');
      if(b){var inp=m.querySelector('input.dtxt');var out={v:b.getAttribute('data-r'),txt:inp?inp.value:'',root:m};res(out);m.remove()}
    });
  });
}
function askConfirm(title,text,ok,danger){
  return dialog('<h3>'+esc(title)+'</h3><p>'+esc(text)+'</p><div class="dbtn"><button class="bt" data-r="0">Bỏ qua</button><button class="bt '+(danger?'red':'pri')+'" data-r="1">'+esc(ok||'Xác nhận')+'</button></div>').then(function(r){return r.v==='1'});
}
function askText(title,def){
  return dialog('<h3>'+esc(title)+'</h3><input class="dtxt txt" value="'+esc(def||'')+'" maxlength="40"><div class="dbtn"><button class="bt" data-r="0">Bỏ qua</button><button class="bt pri" data-r="1">Lưu</button></div>').then(function(r){return r.v==='1'?r.txt.trim():null});
}
function busy(on,msg){
  var b=$('#busy');
  if(!on){b.hidden=true;return}
  b.hidden=false;$('#busyMsg').textContent=msg||'Đang xử lý…';$('#busyBar').style.width='0%';
}
function busyP(p){$('#busyBar').style.width=Math.round(clamp(p,0,1)*100)+'%'}
function fileToImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){URL.revokeObjectURL(url);res(im)};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('Không đọc được ảnh'))};
    im.src=url;
  });
}
function toBlob(c,type,q){return new Promise(function(res){c.toBlob(res,type,q)})}
function roundRectPath(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
/* ===== Bộ xử lý điểm ảnh ===== */
var S2L=new Float32Array(256);
(function(){for(var i=0;i<256;i++){var c=i/255;S2L[i]=c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4)}})();
var L2S_N=8192,L2S=new Uint8ClampedArray(L2S_N+1);
(function(){for(var i=0;i<=L2S_N;i++){var v=i/L2S_N;L2S[i]=255*(v<=0.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-0.055)}})();
function lin2s(v){return v<=0?0:(v>=1?255:L2S[(v*L2S_N+0.5)|0])}
var EXP20=new Float32Array(256),EXP16=new Float32Array(256);
(function(){for(var i=0;i<256;i++){EXP20[i]=Math.exp(-i*i/(2*20*20));EXP16[i]=Math.exp(-i*i/(2*16*16))}})();
function bump(x,c,w){var d=(x-c)/w;return Math.exp(-d*d)}

/* Đường cong tông màu (một bảng 256 mục cho cả 3 kênh) */
function buildTone(q){
  var tmp=new Float32Array(256),lut=new Uint8ClampedArray(256),m=0,i,x;
  for(i=0;i<256;i++){
    x=i/255;
    if(q.ex){var l=S2L[i]*Math.pow(2,q.ex*1.6);x=l<=0?0:(l>=1?1:(l<=0.0031308?12.92*l:1.055*Math.pow(l,1/2.4)-0.055))}
    if(q.bp){var a=q.bp*0.12;x=(x-a)/(1-a)}
    x=clamp(x,0,1);
    if(q.sh)x+=q.sh*0.32*bump(x,0.22,0.24);
    if(q.hl)x+=q.hl*0.28*bump(x,0.82,0.22);
    if(q.br)x+=q.br*(0.16*bump(x,0.28,0.25)-0.10*bump(x,0.88,0.2));
    x=clamp(x,0,1);
    if(q.ct){var ss=x*x*(3-2*x);x+=q.ct*0.9*(ss-x)}
    x=clamp(x,0,1);
    if(q.bright)x=Math.pow(x,1/(1+q.bright*0.7));
    if(q.hlr&&x>0.6)x=0.6+(x-0.6)*(1-q.hlr);
    if(q.fd)x=x*(1-q.fd)+q.fd;
    tmp[i]=clamp(x,0,1);
  }
  for(i=0;i<256;i++){if(tmp[i]>m)m=tmp[i];lut[i]=m*255}
  return lut;
}
function hueOff(h){ /* màu thuần theo góc sắc độ, trừ đi mức xám trung bình */
  h=((h%360)+360)%360/60;var c=1,x=1-Math.abs(h%2-1),r,g,b;
  if(h<1){r=c;g=x;b=0}else if(h<2){r=x;g=c;b=0}else if(h<3){r=0;g=c;b=x}else if(h<4){r=0;g=x;b=c}else if(h<5){r=x;g=0;b=c}else{r=c;g=0;b=x}
  var m=(r+g+b)/3;return [r-m,g-m,b-m];
}

/* ===== Giả lập màu film: mỗi dòng "Tên|khóa giá trị ..." =====
 ex sáng, ct tương phản, fd nâng đen, hl nén vùng sáng, sat, vib, wm ấm, tn sắc thái,
 sh/hi = góc-màu:mức cho vùng tối/vùng sáng, gs dịch màu lá (+vàng/-lục lam), bs dịch màu trời (+lam ngọc/-tím),
 gr hạt, vg tối viền, mono đen trắng */
var FILM_RAW=[
{id:'cd',name:'Chân dung',list:[
'Da Đào 160|ct.08 fd.03 sat-.06 vib.1 wm.1 tn.03 sh20:.04 hi35:.05 gr.01',
'Sữa Ấm|ct-.1 fd.06 sat-.12 wm.08 hl.1 hi40:.04 ex.08',
'Nắng Chiều Phố|ct.12 fd.04 sat.08 wm.18 sh15:.06 hi45:.1 vg.12 gr.015',
'Kem Dâu|ct-.05 fd.05 sat-.04 vib.12 tn.08 wm.05 hi340:.06 sh330:.03 ex.1',
'Mơ Phai 400|ct.1 fd.08 sat-.18 wm.14 sh25:.05 hi50:.08 gr.03 vg.15',
'Cổ Điển Nâu|ct.18 fd.07 sat-.2 wm.16 sh30:.09 hi45:.07 gr.03 vg.2',
'Trong Veo|ct.05 sat.04 vib.14 wm-.02 ex.08 hl.08',
'Lụa Hồng|ct-.12 fd.07 sat-.1 tn.12 wm.04 hi330:.07 ex.12 hl.12',
'Studio Trắng|ct.1 sat-.08 wm-.05 ex.15 hl.18 fd.02',
'Đêm Neon Tím|ct.2 sat.12 sh270:.12 hi330:.08 wm-.08 vg.22 gr.02',

var RATIOS={'1:1':1,'4:5':4/5,'3:4':3/4,'9:16':9/16,'16:9':16/9,'3:2':3/2,'2:3':2/3};
function frameLayout(w,h,f){
  var m=Math.min(w,h),L={x:0,y:0,w:w,h:h,W:w,H:h,r:0};
  if(f.style!=='none'){
    var pad=Math.round(m*f.w),bot=Math.round(m*f.bottom);
    L.W=w+2*pad;L.H=h+2*pad+bot;L.x=pad;L.y=pad;L.r=Math.round(m*f.radius);
  }
  if(f.ratio!=='orig'&&RATIOS[f.ratio]){
    var ra=RATIOS[f.ratio],cw=L.W,ch=L.H;
    if(cw/ch<ra)cw=Math.round(ch*ra);else ch=Math.round(cw/ra);
    L.x+=Math.round((cw-L.W)/2);L.y+=Math.round((ch-L.H)/2);L.W=cw;L.H=ch;
  }
  return L;
}
function noFrame(){return {style:'none',w:0,color:'#000',bottom:0,radius:0,shadow:false,ratio:'orig'}}

/* ----- chữ, nét vẽ, dấu tên ----- */
function fontStr(t,fs){return (t.italic?'italic ':'')+(t.bold?'700 ':'400 ')+Math.max(1,fs)+'px '+t.font}
function textMetrics(ctx,t,W){
  var fs=t.size*W;ctx.font=fontStr(t,fs);
  var lines=String(t.text||' ').split('\n'),lh=fs*1.2,mw=0;
  lines.forEach(function(l){var w=ctx.measureText(l||' ').width;if(w>mw)mw=w});
  return {fs:fs,lines:lines,lh:lh,w:mw,h:lh*lines.length};
}
function drawTexts(ctx,W,H,texts){
  texts.forEach(function(t){
    if(!t.text)return;
    var m=textMetrics(ctx,t,W);
    ctx.save();ctx.translate(t.x*W,t.y*H);ctx.rotate(t.rot*Math.PI/180);ctx.globalAlpha=t.op;
    ctx.textBaseline='middle';ctx.textAlign='left';ctx.font=fontStr(t,m.fs);
    var pad=m.fs*0.28;
    if(t.bg){ctx.fillStyle=t.bgc;ctx.globalAlpha=t.op*0.85;roundRectPath(ctx,-m.w/2-pad,-m.h/2-pad*0.6,m.w+pad*2,m.h+pad*1.2,m.fs*0.2);ctx.fill();ctx.globalAlpha=t.op}
    for(var i=0;i<m.lines.length;i++){
      var lw=ctx.measureText(m.lines[i]).width,x0=t.align==='left'?-m.w/2:(t.align==='right'?m.w/2-lw:-lw/2),y0=-m.h/2+m.lh*(i+0.5);
      if(t.shadow){ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=m.fs*0.14;ctx.shadowOffsetX=m.fs*0.04;ctx.shadowOffsetY=m.fs*0.05}
      if(t.stroke>0){ctx.lineJoin='round';ctx.lineWidth=t.stroke*m.fs;ctx.strokeStyle=t.strokec;ctx.strokeText(m.lines[i],x0,y0)}
      ctx.fillStyle=t.color;
      ctx.fillText(m.lines[i],x0,y0);
      ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    }
    ctx.restore();
  });
}
var STMP=null;
function drawStrokes(ctx,W,H,strokes){
  if(!strokes.length)return;
  if(!STMP)STMP=document.createElement('canvas');
  if(STMP.width!==W||STMP.height!==H){STMP.width=W;STMP.height=H}
  var c=STMP.getContext('2d');c.clearRect(0,0,W,H);
  strokes.forEach(function(s){
    c.save();
    c.globalCompositeOperation=s.tool==='erase'?'destination-out':'source-over';
    c.globalAlpha=s.tool==='hl'?Math.min(0.4,s.a):s.a;
    c.lineCap=s.tool==='hl'?'square':'round';c.lineJoin='round';
    c.lineWidth=s.w*W*(s.tool==='hl'?2.2:1);c.strokeStyle=s.color;c.fillStyle=s.color;
    var p=s.pts,x0=p[0][0]*W,y0=p[0][1]*H,x1=p[p.length-1][0]*W,y1=p[p.length-1][1]*H;
    if(s.tool==='pen'||s.tool==='hl'||s.tool==='erase'){
      if(p.length<2){c.beginPath();c.arc(x0,y0,c.lineWidth/2,0,6.2832);c.fill()}
      else{c.beginPath();c.moveTo(x0,y0);for(var i=1;i<p.length-1;i++){var mx=(p[i][0]+p[i+1][0])/2*W,my=(p[i][1]+p[i+1][1])/2*H;c.quadraticCurveTo(p[i][0]*W,p[i][1]*H,mx,my)}c.lineTo(x1,y1);c.stroke()}
    }else if(s.tool==='rect'){c.strokeRect(Math.min(x0,x1),Math.min(y0,y1),Math.abs(x1-x0),Math.abs(y1-y0))}
    else if(s.tool==='ell'){c.beginPath();c.ellipse((x0+x1)/2,(y0+y1)/2,Math.max(1,Math.abs(x1-x0)/2),Math.max(1,Math.abs(y1-y0)/2),0,0,6.2832);c.stroke()}
    else if(s.tool==='arrow'){

var WMIMG=null,WMSRC='';
function wmImage(){
  var w=doc.p.wm;if(!w.logo){WMIMG=null;WMSRC='';return null}
  if(WMSRC!==w.logo){WMSRC=w.logo;WMIMG=new Image();WMIMG.onload=function(){scheduleRender()};WMIMG.src=w.logo}
  return WMIMG&&WMIMG.complete&&WMIMG.naturalWidth?WMIMG:null;
}
function drawWM(ctx,W,H){
  var w=doc.p.wm;if(!w.on)return;
  var img=wmImage();if(!w.text&&!img)return;
  var fs=w.size*W,mar=w.mar*W;
  ctx.save();ctx.globalAlpha=w.op;ctx.textBaseline='middle';
  ctx.font='700 '+fs+'px -apple-system,Helvetica,Arial,sans-serif';
  var tw=w.text?ctx.measureText(w.text).width:0,lh=img?fs*1.6:0,lw=img?lh*img.naturalWidth/img.naturalHeight:0,gap=(tw&&img)?fs*0.4:0;
  var bw=tw+lw+gap,bh=Math.max(fs*1.2,lh);
  function one(cx,cy){
    ctx.save();ctx.translate(cx,cy);
    var x=-bw/2;
    if(img){ctx.drawImage(img,x,-lh/2,lw,lh);x+=lw+gap}
    if(w.text){ctx.textAlign='left';ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=fs*0.12;ctx.fillStyle=w.color;ctx.fillText(w.text,x,0)}
    ctx.restore();
  }
  if(w.pos==='tile'){
    ctx.translate(W/2,H/2);ctx.rotate(-0.5236);
    var sx=bw+W*0.12,sy=bh+H*0.09,d=Math.sqrt(W*W+H*H);

  }else{
    var col=w.pos.charAt(1),row=w.pos.charAt(0),cx=col==='l'?mar+bw/2:(col==='r'?W-mar-bw/2:W/2),cy=row==='t'?mar+bh/2:(row==='b'?H-mar-bh/2:H/2);

function composite(ctx,W,H,pc,L,f,noOv){

  ctx.save();if(L.r>0){roundRectPath(ctx,L.x,L.y,L.w,L.h,L.r);ctx.clip()}ctx.drawImage(pc,L.x,L.y,L.w,L.h);ctx.restore();
  if(!noOv){drawStrokes(ctx,W,H,doc.strokes);drawTexts(ctx,W,H,doc.texts);drawWM(ctx,W,H)}

var BARE={crop:1,erase:1,beauty:1};
var rq=0;
function scheduleRender(ovOnly){if(!ovOnly)pendingFull=true;if(rq)return;rq=requestAnimationFrame(function(){rq=0;renderNow()})}
function coverScale(W,H,a){var s=Math.abs(Math.sin(a)),c=Math.abs(Math.cos(a));return c+s*Math.max(W/H,H/W)}
function setViewSize(w,h){
  var v=$('#view');
  if(v.width!==w||v.height!==h){v.width=w;v.height=h;var o=$('#ov');o.width=w;o.height=h;layoutStage()}
}
function renderNow(){
  if(!doc.base)return;
  var pv=getPV();
  if(!OUTC||OUTC.width!==pv.w||OUTC.height!==pv.h){OUTC=cv(pv.w,pv.h);pendingFull=true}
  if(pendingFull){
    var out=ui.cmp?pv.data:pipe(pv.data,pv.w,pv.h,doc.p,true);
    OUTC.getContext('2d').putImageData(new ImageData(out,pv.w,pv.h),0,0);
    pendingFull=false;
  }
  var ctx=$('#view').getContext('2d'),W=pv.w,H=pv.h;
  if(ui.tab==='crop'&&ui.crop){
    setViewSize(W,H);ctx.fillStyle='#EFEDE7';ctx.fillRect(0,0,W,H);
    var a=ui.crop.angle*Math.PI/180,k=coverScale(W,H,a);
    ctx.save();ctx.translate(W/2,H/2);ctx.rotate(a);ctx.scale(k,k);ctx.drawImage(OUTC,-W/2,-H/2);ctx.restore();
  }else if(BARE[ui.tab]){setViewSize(W,H);ctx.drawImage(OUTC,0,0)}
  else{
    var f=ui.cmp?noFrame():doc.p.frame,L=frameLayout(W,H,f);
    setViewSize(L.W,L.H);composite(ctx,L.W,L.H,OUTC,L,f,ui.cmp);
  }
  drawOv();
}
function drawOv(){
  var o=$('#ov'),c=o.getContext('2d'),W=o.width,H=o.height;
  c.clearRect(0,0,W,H);
  if(ui.cmp)return;
  var u=Math.max(1,W/400);
  if(ui.tab==='crop'&&ui.crop&&ui.crop.rect){
    var r=ui.crop.rect;
    c.fillStyle='rgba(0,0,0,.55)';c.fillRect(0,0,W,r.y);c.fillRect(0,r.y+r.h,W,H-r.y-r.h);c.fillRect(0,r.y,r.x,r.h);c.fillRect(r.x+r.w,r.y,W-r.x-r.w,r.h);
    c.strokeStyle='#fff';c.lineWidth=1.5*u;c.strokeRect(r.x,r.y,r.w,r.h);
    c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=u;c.beginPath();
    for(var i=1;i<3;i++){c.moveTo(r.x+r.w*i/3,r.y);c.lineTo(r.x+r.w*i/3,r.y+r.h);c.moveTo(r.x,r.y+r.h*i/3);c.lineTo(r.x+r.w,r.y+r.h*i/3)}

    c.fillStyle='#fff';var hs=7*u,pts=cropHandles(r);
    for(var k in pts){if(ui.crop.ratio!=='free'&&k.length===1)continue;c.fillRect(pts[k][0]-hs,pts[k][1]-hs,hs*2,hs*2)}
  }else if(ui.tab==='erase'&&MASKC){
    c.drawImage(MASKC,0,0);
    if(ui.lasso&&ui.lasso.length>1){c.strokeStyle='#fff';c.lineWidth=2*u;c.setLineDash([6*u,4*u]);c.beginPath();c.moveTo(ui.lasso[0][0],ui.lasso[0][1]);for(var j=1;j<ui.lasso.length;j++)c.lineTo(ui.lasso[j][0],ui.lasso[j][1]);c.stroke();c.setLineDash([])}
  }else if(ui.tab==='text'&&ui.sel>=0&&doc.texts[ui.sel]){
    var t=doc.texts[ui.sel],m=textMetrics(c,t,W),pad=m.fs*0.3;
    c.save();c.translate(t.x*W,t.y*H);c.rotate(t.rot*Math.PI/180);c.strokeStyle='#8CC0B0';c.lineWidth=2.5*u;c.setLineDash([7*u,5*u]);c.strokeRect(-m.w/2-pad,-m.h/2-pad*0.6,m.w+pad*2,m.h+pad*1.2);c.restore();
  }else if(ui.tab==='beauty'&&ui.bmode!=='view'&&doc.p.beauty.st.length){
    drawSkinRed(c,W,H,doc.p.beauty.st);
  }
}

function layoutStage(){

}

/* ----- xuất ảnh ----- */
async function buildFinal(){
  var b=doc.base,W=b.width,H=b.height,id=b.getContext('2d').getImageData(0,0,W,H);
  var out=pipe(id.data,W,H,doc.p,false);
  var oc=cv(W,H);oc.getContext('2d').putImageData(new ImageData(out,W,H),0,0);
  var f=doc.p.frame,L=frameLayout(W,H,f),sc=1,lim=15500000;
  if(L.W*L.H>lim)sc=Math.sqrt(lim/(L.W*L.H));
  var fc=cv(L.W*sc,L.H*sc),x=fc.getContext('2d');
  x.scale(sc,sc);x.imageSmoothingQuality='high';
  /* các lớp chữ/nét vẽ dùng tọa độ tương đối nên không bị ảnh hưởng khi thu nhỏ; dùng kích thước L.W,L.H */
  composite(x,L.W,L.H,oc,L,f,false);
  return fc;
}
async function exportImage(fmt,q){
  busy(true,'Đang xuất ảnh…');await nextFrame();
  try{
    var fc=await buildFinal(),png=fmt==='png',type=png?'image/png':'image/jpeg';
    var blob=await toBlob(fc,type,q);
    if(!blob)throw new Error('toBlob');
    var d=new Date(),pad=function(n){return (n<10?'0':'')+n};
    var name='anh-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds())+(png?'.png':'.jpg');
    var file=new File([blob],name,{type:type});
    busy(false);
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return {ok:true,shared:true,w:fc.width,h:fc.height,size:blob.size}}catch(e){if(e&&e.name==='AbortError')return {ok:true,aborted:true}}
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},4000);
    toast('Đã tải ảnh về máy');
    return {ok:true,w:fc.width,h:fc.height,size:blob.size,blob:blob};
  }catch(e){busy(false);toast('Xuất ảnh lỗi: ảnh quá lớn hoặc hết bộ nhớ');return {ok:false}}
}

function ratioVal(){
  var c=ui.crop,v=$('#view');if(!c||c.ratio==='free')return null;
  return c.ratio==='orig'?v.width/v.height:RATIOS[c.ratio];
}
function initCrop(){var pv=getPV();ui.crop={rect:{x:0,y:0,w:pv.w,h:pv.h},ratio:'free',angle:0,drag:null}}
function cropHandles(r){return {tl:[r.x,r.y],tr:[r.x+r.w,r.y],bl:[r.x,r.y+r.h],br:[r.x+r.w,r.y+r.h],t:[r.x+r.w/2,r.y],b:[r.x+r.w/2,r.y+r.h],l:[r.x,r.y+r.h/2],r:[r.x+r.w,r.y+r.h/2]}}
function hitCrop(p){
  var c=ui.crop,v=$('#view'),sc=v.width/v.getBoundingClientRect().width,tol=30*sc,hs=cropHandles(c.rect),k,best=null,bd=1e9;
  for(k in hs){if(c.ratio!=='free'&&k.length===1)continue;var d=Math.hypot(p.x-hs[k][0],p.y-hs[k][1]);if(d<tol&&d<bd){bd=d;best=k}}
  if(best)return best;
  var r=c.rect;if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h)return 'move';
  return null;
}
function dragCrop(c,p){
  var v=$('#view'),W=v.width,H=v.height,sc=W/v.getBoundingClientRect().width,mn=30*sc,d=c.drag,r0=d.r,dx=p.x-d.p.x,dy=p.y-d.p.y,h=d.h,ra=ratioVal();
  if(h==='move'){c.rect={x:clamp(r0.x+dx,0,W-r0.w),y:clamp(r0.y+dy,0,H-r0.h),w:r0.w,h:r0.h};return}
  var l=r0.x,t=r0.y,rt=r0.x+r0.w,b=r0.y+r0.h;
  if(ra===null){
    if(h.indexOf('l')>=0)l=clamp(l+dx,0,rt-mn);
    if(h.indexOf('r')>=0)rt=clamp(rt+dx,l+mn,W);
    if(h.indexOf('t')>=0)t=clamp(t+dy,0,b-mn);

function initMask(){var pv=getPV();MASKC=cv(pv.w,pv.h);ui.lasso=null}

  down:function(p){ui.last=p;if(ui.emode==='lasso')ui.lasso=[[p.x,p.y]];else maskDot(p);drawOv()},
  move:function(p){

  },
  up:function(){

var erasing=false;
async function doErase(){
  if(erasing||!MASKC)return;
  var b=doc.base,W=b.width,H=b.height,mc=cv(W,H),mx=mc.getContext('2d');
  mx.drawImage(MASKC,0,0,W,H);
  var md=mx.getImageData(0,0,W,H).data,minX=W,maxX=-1,minY=H,maxY=-1,n=0,x,y;
  for(y=0;y<H;y++)for(x=0;x<W;x++)if(md[(y*W+x)*4+3]>40){n++;if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y}
  if(!n){toast('Chưa tô vùng nào để xóa');return}
  erasing=true;busy(true,'Đang xóa vật thể…');await nextFrame();
  try{
    var bw=maxX-minX+1,bh=maxY-minY+1,margin=Math.max(32,Math.round(1.2*Math.max(bw,bh)));
    var rx0=Math.max(0,minX-margin),ry0=Math.max(0,minY-margin),rx1=Math.min(W-1,maxX+margin),ry1=Math.min(H-1,maxY+margin),rw=rx1-rx0+1,rh=ry1-ry0+1;
    var f=Math.min(1,700/Math.max(rw,rh)),sw=Math.max(8,Math.round(rw*f)),sh=Math.max(8,Math.round(rh*f));
    var rc=cv(sw,sh),rx=rc.getContext('2d');rx.imageSmoothingQuality='high';rx.drawImage(b,rx0,ry0,rw,rh,0,0,sw,sh);
    var rgba=rx.getImageData(0,0,sw,sh).data;
    var mrc=cv(sw,sh),mrx=mrc.getContext('2d');mrx.drawImage(mc,rx0,ry0,rw,rh,0,0,sw,sh);
    var md2=mrx.getImageData(0,0,sw,sh).data,mask=new Uint8Array(sw*sh),i;
    for(i=0;i<sw*sh;i++)mask[i]=md2[i*4+3]>40?1:0;
    mask=dilateMask(mask,sw,sh,Math.max(2,Math.round(Math.max(sw,sh)*0.006)));
    var res=await runInpaint(new Uint8ClampedArray(rgba),mask,sw,sh,busyP);
    /* ghép lại ở độ phân giải gốc, viền mềm 2px */
    var oc=cv(sw,sh);oc.getContext('2d').putImageData(new ImageData(res,sw,sh),0,0);
    var fc=cv(rw,rh),fx=fc.getContext('2d');fx.imageSmoothingQuality='high';fx.drawImage(oc,0,0,rw,rh);
    var fd=fx.getImageData(0,0,rw,rh).data,orig=b.getContext('2d').getImageData(rx0,ry0,rw,rh),od=orig.data;
    var fm=new Uint8Array(rw*rh),mfull=mx.getImageData(rx0,ry0,rw,rh).data;
    for(i=0;i<rw*rh;i++)fm[i]=mfull[i*4+3]>40?1:0;
    fm=dilateMask(fm,rw,rh,Math.max(2,Math.round(Math.max(sw,sh)*0.006/f)));
    var sm=new Uint8ClampedArray(rw*rh*4);
    for(i=0;i<rw*rh;i++){var v=fm[i]?255:0;sm[i*4]=sm[i*4+1]=sm[i*4+2]=v;sm[i*4+3]=255}
    var bl=boxBlur(sm,rw,rh,2,1);
    for(i=0;i<rw*rh;i++){
      var a=bl[i*4]/255;if(a<=0)continue;
      od[i*4]=od[i*4]+(fd[i*4]-od[i*4])*a;od[i*4+1]=od[i*4+1]+(fd[i*4+1]-od[i*4+1])*a;od[i*4+2]=od[i*4+2]+(fd[i*4+2]-od[i*4+2])*a;
    }
    var nb=cv(W,H),nx=nb.getContext('2d');nx.drawImage(b,0,0);nx.putImageData(orig,rx0,ry0);
    setBase(nb);PIPE={};pendingFull=true;commit();initMask();toast('Đã xóa vật thể');
  }catch(e){toast('Xóa lỗi, thử tô vùng nhỏ hơn')}
  erasing=false;busy(false);refreshPanel();scheduleRender();
}

};
ACT.colDel=async function(v){
  var cols=lsGet(K_COLORS,[]),c=cols[+v];if(!c)return false;
  if(!(await askConfirm('Xóa màu mẫu','Xóa “'+c.name+'” khỏi máy?','Xóa',true)))return false;
  cols.splice(+v,1);lsSet(K_COLORS,cols);refreshPanel();return false;
};
ACT.cropRatio=function(v){setCropRatio(v)};
ACT.cropReset=function(){initCrop()};
ACT.cropApply=function(){applyCrop();return false};
ACT.geom=function(v){geom(v);return false};
ACT.maskClear=function(){initMask();drawOv()};
ACT.doErase=function(){doErase();return false};
ACT.tAdd=function(){var t=newText();doc.texts.push(t);ui.sel=doc.texts.length-1;commit()};
ACT.tSel=function(v){ui.sel=+v};
ACT.tDup=function(){var t=curText();if(!t)return false;var c=JSON.parse(JSON.stringify(t));c.x=Math.min(0.9,c.x+0.05);c.y=Math.min(0.9,c.y+0.05);doc.texts.push(c);ui.sel=doc.texts.length-1;commit()};
ACT.tDel=function(){if(ui.sel<0)return false;doc.texts.splice(ui.sel,1);ui.sel=doc.texts.length-1;commit()};
ACT.tColor=function(v){var t=curText();if(t){t.color=v;commit()}};
ACT.tAlign=function(v){var t=curText();if(t){t.align=v;commit()}};
ACT.dColor=function(v){ui.dcolor=v};
ACT.strokeUndo=function(){if(doc.strokes.length){doc.strokes.pop();commit()}};
ACT.strokeClear=async function(){
  if(!doc.strokes.length)return false;
  if(!(await askConfirm('Xóa nét vẽ','Xóa tất cả nét vẽ trên ảnh?','Xóa hết',true)))return false;
  doc.strokes=[];commit();refreshPanel();scheduleRender(true);return false;
};
ACT.framePre=function(v){
  var f=doc.p.frame;
  if(v==='none'){f.style='none';f.bottom=0;f.radius=0;f.w=0.04}
  else if(v==='thin'){f.style='solid';f.w=0.02;f.bottom=0;f.radius=0}
  else if(v==='thick'){f.style='solid';f.w=0.06;f.bottom=0;f.radius=0}
  else if(v==='pol'){f.style='solid';f.w=0.05;f.bottom=0.14;f.radius=0;f.color='#ffffff'}
  else if(v==='round'){f.style='solid';f.w=0.02;f.bottom=0;f.radius=0.06}
  commit();
};
ACT.frameRatio=function(v){doc.p.frame.ratio=v;commit()};
ACT.fColor=function(v){var f=doc.p.frame;f.color=v;if(f.style==='none'&&f.ratio==='orig'){}commit()};
ACT.wmPos=function(v){doc.p.wm.pos=v;doc.p.wm.on=true;commit()};
ACT.wmColor=function(v){doc.p.wm.color=v;commit()};
ACT.logoPick=function(){$('#fileLogo').value='';$('#fileLogo').click();return false};
ACT.logoDel=function(){doc.p.wm.logo='';commit()};
ACT.wmSaveDef=function(){var w=doc.p.wm;LOCAL.wm={on:w.on,text:w.text,logo:w.logo,pos:w.pos,size:w.size,op:w.op,mar:w.mar,color:w.color};saveLocal();toast('Đã lưu dấu tên làm mặc định');return false};

/* ----- nhập ảnh, ảnh mẫu, logo ----- */
$('#bPick').addEventListener('click',function(){$('#fileMain').value='';$('#fileMain').click()});
$('#bOpen').addEventListener('click',async function(){
  if(doc.base&&HI>0&&!(await askConfirm('Mở ảnh khác','Ảnh đang sửa sẽ bị đóng. Hãy lưu trước nếu cần.','Mở ảnh khác',false)))return;
  $('#fileMain').value='';$('#fileMain').click();
});
$('#fileMain').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(f)loadFile(f)});
$('#fileRef').addEventListener('change',async function(e){
  var f=e.target.files&&e.target.files[0];if(!f||!doc.base)return;
  busy(true,'Đang đọc màu ảnh mẫu…');await nextFrame();
  try{
    var im=await fileToImage(f),w=im.naturalWidth,h=im.naturalHeight,sc=Math.min(1,256/Math.max(w,h)),c=cv(w*sc,h*sc),x=c.getContext('2d');
    x.imageSmoothingQuality='high';x.drawImage(im,0,0,c.width,c.height);
    var st=labStats(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    var s=Math.min(w,h),tc=cv(96,96);tc.getContext('2d').drawImage(im,(w-s)/2,(h-s)/2,s,s,0,0,96,96);
    var old=doc.p.match;
    doc.p.match={on:true,mode:old?old.mode:'soft',t:old?old.t:1,keepL:old?old.keepL:false,ref:{id:uid(),thumb:tc.toDataURL('image/jpeg',0.8),stats:st}};
    commit();modelChanged();refreshPanel();
  }catch(err){toast('Không đọc được ảnh mẫu')}
  busy(false);
});
$('#fileLogo').addEventListener('change',async function(e){
  var f=e.target.files&&e.target.files[0];if(!f||!doc.base)return;
  try{
    var im=await fileToImage(f),sc=Math.min(1,400/Math.max(im.naturalWidth,im.naturalHeight)),c=cv(im.naturalWidth*sc,im.naturalHeight*sc);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    doc.p.wm.logo=c.toDataURL('image/png');doc.p.wm.on=true;commit();refreshPanel();scheduleRender(true);
  }catch(err){toast('Không đọc được logo')}
});

/* ----- thanh trên: hoàn tác, so sánh, lưu, cài đặt ----- */
$('#bUndo').addEventListener('click',undo);
$('#bRedo').addEventListener('click',redo);
(function(){
  var b=$('#bCmp');
  function on(e){if(!doc.base)return;e.preventDefault();ui.cmp=true;b.classList.add('hold');pendingFull=true;renderNow()}
  function off(){if(!ui.cmp)return;ui.cmp=false;b.classList.remove('hold');pendingFull=true;scheduleRender()}
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);
  b.addEventListener('contextmenu',function(e){e.preventDefault()});
})();
$('#bSave').addEventListener('click',function(){
  if(!doc.base){toast('Chưa có ảnh để lưu');return}
  var fmt=LOCAL.fmt,q=LOCAL.q;
  dialog('<h3>Lưu ảnh</h3><div class="chips" id="fmtChips"><button class="chip'+(fmt==='jpg'?' on':'')+'" data-f="jpg">JPEG (nhẹ)</button><button class="chip'+(fmt==='png'?' on':'')+'" data-f="png">PNG (không nén)</button></div>'+
    '<div class="sl"><div class="sh"><span>Chất lượng JPEG</span><b id="qv">'+Math.round(q*100)+'</b></div><input type="range" id="qr" min="60" max="100" value="'+Math.round(q*100)+'"></div>'+
    '<p class="hint">Ảnh xuất theo kích thước đang làm việc ('+doc.base.width+'×'+doc.base.height+' px, chưa tính khung). Trong bảng hiện ra, chọn “Lưu hình ảnh” để vào thư viện Ảnh.</p>'+
    '<div class="dbtn"><button class="bt" data-r="0">Bỏ qua</button><button class="bt pri" data-r="1">Lưu</button></div>',
    function(m){
      m.addEventListener('click',function(e){var c=e.target.closest('[data-f]');if(c){fmt=c.getAttribute('data-f');$$('#fmtChips .chip',m).forEach(function(x){x.classList.toggle('on',x===c)})}});
      m.querySelector('#qr').addEventListener('input',function(e){q=Number(e.target.value)/100;m.querySelector('#qv').textContent=e.target.value});
    }).then(function(r){
      if(r.v!=='1')return;
      LOCAL.fmt=fmt;LOCAL.q=q;saveLocal();exportImage(fmt,q);
    });
});
$('#bSet').addEventListener('click',function(){
  var me=LOCAL.maxEdge;
  dialog('<h3>Cài đặt</h3><h4>Cạnh dài tối đa khi mở ảnh</h4><div class="chips" id="meChips">'+[2048,3000,4096].map(function(v){return '<button class="chip'+(me===v?' on':'')+'" data-e="'+v+'">'+v+' px</button>'}).join('')+'</div>'+
    '<p class="hint">Áp dụng cho ảnh mở sau này. Ảnh càng lớn càng nặng máy; 3000 px là mức cân bằng cho iPhone.</p>'+
    '<h4>Bộ chỉnh riêng và màu mẫu</h4><div class="row"><button class="bt sm" data-r="exp">Xuất ra file</button><button class="bt sm" data-r="imp">Nhập từ file</button></div>'+
    '<p class="hint">Phiên bản '+APP_VER+'</p><div class="dbtn"><button class="bt pri" data-r="ok">Xong</button></div>',
    function(m){m.addEventListener('click',function(e){var c=e.target.closest('[data-e]');if(c){me=Number(c.getAttribute('data-e'));$$('#meChips .chip',m).forEach(function(x){x.classList.toggle('on',x===c)})}})}
  ).then(async function(r){
    if(me!==LOCAL.maxEdge){LOCAL.maxEdge=me;saveLocal()}
    if(r.v==='exp'){
      var blob=new Blob([JSON.stringify({app:'chinhanh',sets:lsGet(K_SETS,[]),colors:lsGet(K_COLORS,[])})],{type:'application/json'}),file=new File([blob],'chinhanh-bo-chinh.json',{type:'application/json'});
      try{if(navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file]});else{var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=file.name;a.click()}}catch(e){}
    }else if(r.v==='imp'){$('#fileSets').value='';$('#fileSets').click()}
  });
});
$('#fileSets').addEventListener('change',function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var d=JSON.parse(rd.result);if(d.app!=='chinhanh')throw 0;
      var sets=lsGet(K_SETS,[]),cols=lsGet(K_COLORS,[]),ns=0,nc=0;
      (d.sets||[]).forEach(function(s){if(!sets.some(function(x){return x.name===s.name})){sets.push(s);ns++}});
      (d.colors||[]).forEach(function(c){if(!cols.some(function(x){return x.name===c.name})){cols.push(c);nc++}});
      lsSet(K_SETS,sets);lsSet(K_COLORS,cols);refreshPanel();toast('Đã nhập '+ns+' bộ chỉnh, '+nc+' màu mẫu');
    }catch(err){toast('File này không phải bản xuất của app')}
  };
  rd.readAsText(f);
});

/* ----- khởi động ----- */
/* chặn chạm đúp phóng to trang của Safari, và không để lỗi làm treo màn hình */
['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()})});
document.addEventListener('dblclick',function(e){if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.preventDefault()});
function failSafe(){try{busy(false)}catch(e){}erasing=false;PT={};ui.pinch=null;ui.panning=null;ui.tooling=false;toast('Có lỗi nhỏ, đã khôi phục. Thử lại nhé')}
window.addEventListener('error',failSafe);
window.addEventListener('unhandledrejection',failSafe);
window.addEventListener('resize',layoutStage);
window.addEventListener('orientationchange',function(){setTimeout(layoutStage,200)});
buildTabs();refreshPanel();updUndo();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){})}
</script>
